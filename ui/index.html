<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convoy — Commander Pulse</title>
<style>
:root {
  --bg: #0a0e14; --card: rgba(17,24,39,0.72); --gold: #D4A84B;
  --text: #f1f5f9; --text2: #94a3b8; --border: rgba(148,163,184,0.12);
  --green: #34d399; --red: #f87171; --amber: #fbbf24; --blue: #38bdf8;
  --purple: #a78bfa; --zero: rgba(148,163,184,0.45);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; padding:24px; }
h1 { font-size:22px; font-weight:700; letter-spacing:-0.5px; margin-bottom:4px; }
h1 .dot { color:var(--gold); }
.sub { color:var(--text2); font-size:13px; margin-bottom:20px; }
.bands { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
@media (max-width:800px){ .bands{grid-template-columns:1fr;} }
.band { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.band h2 { font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text2); margin-bottom:12px; display:flex; justify-content:space-between; }
.band h2 .count { background:rgba(212,168,75,0.15); color:var(--gold); border-radius:20px; padding:1px 8px; font-size:11px; }
.task { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
.task:last-child { border-bottom:none; }
.task .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.task .meta { color:var(--text2); font-size:11px; margin-top:2px; }
.task .reason { color:var(--amber); font-size:11px; margin-top:2px; }
.empty { color:var(--text2); font-size:12px; text-align:center; padding:20px 0; }
.stuck { border-left:3px solid var(--red); }
.running { border-left:3px solid var(--blue); }
.review { border-left:3px solid var(--amber); }
.done { border-left:3px solid var(--green); }
.agents { margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
.agent { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:12px; display:flex; align-items:center; gap:6px; }
.agent .dot { width:6px; height:6px; border-radius:50%; }
.agent .green { background:var(--green); } .agent .red { background:var(--red); }

/* ── Costs & Usage panel ─────────────────────────────────────── */
.costs { display:none; margin-top:20px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.costs-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; flex-wrap:wrap; gap:6px; }
.costs-head h2 { font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text2); }
.costs-head .summary { font-size:11px; color:var(--text2); }
.cost-grid { display:grid; grid-template-columns:2fr 1.1fr 1.3fr .7fr .6fr .75fr .9fr .8fr .8fr; gap:6px 14px; align-items:center; font-size:12px; }
.cost-grid .h { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text2); border-bottom:1px solid var(--border); padding-bottom:6px; }
.cost-grid .c { padding:7px 0; border-bottom:1px solid var(--border); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cost-grid .num { text-align:right; font-variant-numeric:tabular-nums; }
.cost-grid .row-0 .c { color:var(--zero); }                 /* no usage yet → dimmed */
.cost-grid .total { border-bottom:none; padding-top:10px; font-weight:700; font-size:12.5px; }
.cost-grid .total.grand { border-top:1px solid var(--border); padding-top:10px; font-size:13.5px; color:var(--gold); }
.chip { display:inline-block; padding:1px 8px; border-radius:20px; font-size:10px; letter-spacing:.4px; text-transform:uppercase; background:rgba(148,163,184,.12); color:var(--text2); }
.chip.engineer { background:rgba(56,189,248,.14); color:var(--blue); }
.chip.designer { background:rgba(212,168,75,.16); color:var(--gold); }
.chip.qa       { background:rgba(52,211,153,.14); color:var(--green); }
.chip.analyst  { background:rgba(167,139,250,.15); color:var(--purple); }
.chip.commander{ background:rgba(248,113,113,.14); color:var(--red); }
.window { font-variant-numeric:tabular-nums; }
@media (max-width:900px){
  .cost-grid { grid-template-columns:1fr 1fr; }
  .cost-grid .h, .cost-grid .c.hide-m { display:none; }
  .cost-grid .total .hide-m { display:none; }
}
</style>
</head>
<body>
<h1>Convoy <span class="dot">◈</span> Commander Pulse</h1>
<div class="sub">Agent team orchestration — derived truth from the event log · <span id="ts"></span> · token: <span id="tok" style="color:var(--gold)">•••</span></div>

<div class="bands">
  <div class="band">
    <h2>Running <span class="count" id="c-running">0</span></h2>
    <div id="running"></div>
  </div>
  <div class="band stuck">
    <h2>Stuck <span class="count" id="c-stuck">0</span></h2>
    <div id="stuck"></div>
  </div>
  <div class="band">
    <h2>Done Today <span class="count" id="c-done">0</span></h2>
    <div id="done"></div>
  </div>
</div>

<div class="agents" id="agents"></div>

<div class="costs" id="costs">
  <div class="costs-head">
    <h2>Costs &amp; Usage</h2>
    <div class="summary" id="costs-summary"></div>
  </div>
  <div class="cost-grid" id="costs-grid-head">
    <div class="h">Agent</div><div class="h">Role</div><div class="h hide-m">Window</div>
    <div class="h num">Hours</div><div class="h num">$/h</div><div class="h num">Time</div>
    <div class="h num hide-m">Tokens</div><div class="h num hide-m">Tok $</div><div class="h num">Total</div>
  </div>
  <div id="costs-body"></div>
</div>

<script>
const TOKEN = localStorage.getItem('convoy-token') || prompt('Commander token:') || '';
localStorage.setItem('convoy-token', TOKEN);
document.getElementById('tok').textContent = TOKEN.slice(0, 8) + '…';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toFixed(2);
const fmtk = n => Number(n || 0).toLocaleString();

function roleChip(role) {
  const r = esc(role || 'unassigned');
  return `<span class="chip ${r.toLowerCase()}">${r}</span>`;
}

function taskRow(t, cls) {
  return `<div class="task ${cls}">
    <span class="dot" style="background:${t.status==='stuck'?'var(--red)':t.status==='review'?'var(--amber)':t.status==='doing'?'var(--blue)':'var(--green)'}"></span>
    <div style="flex:1">
      <div>${esc(t.title || t.task_id)}</div>
      <div class="meta">${esc(t.assignee || 'unassigned')} · ${esc(t.task_id)}</div>
      ${t.block_reason ? `<div class="reason">⛔ ${esc(t.block_reason)}</div>` : ''}
    </div>
  </div>`;
}

function costRow(a) {
  const zero = !(a.total_cost > 0 || a.tokens_in > 0);
  const cls = zero ? 'row-0' : '';
  return `<div class="cost-grid ${cls}">
    <div class="c">${esc(a.name || a.agent_id)}</div>
    <div class="c">${roleChip(a.role)}</div>
    <div class="c window hide-m">${a.work_start ? esc(a.work_start) + '–' + esc(a.work_end) : '—'}</div>
    <div class="c num">${fmt(a.hours)}</div>
    <div class="c num">$${fmt(a.rate)}</div>
    <div class="c num">$${fmt(a.cost)}</div>
    <div class="c num hide-m">${fmtk(a.tokens_in + a.tokens_out)}</div>
    <div class="c num hide-m">$${fmt(a.token_cost)}</div>
    <div class="c num"><b>$${fmt(a.total_cost)}</b></div>
  </div>`;
}

async function refresh() {
  try {
    const r = await fetch('/api/board', {headers: {Authorization: 'Bearer ' + TOKEN}});
    if (r.status === 401 || r.status === 403) {
      localStorage.removeItem('convoy-token');
      location.reload();  // re-prompt for token
      return;
    }
    const d = await r.json();
    const b = d.board;
    document.getElementById('running').innerHTML = b.running.length ? b.running.map(t=>taskRow(t,'running')).join('') : '<div class="empty">Nothing running</div>';
    document.getElementById('stuck').innerHTML = b.stuck.length ? b.stuck.map(t=>taskRow(t,'stuck')).join('') : '<div class="empty">No blockers 🎉</div>';
    document.getElementById('done').innerHTML = b.done_today.length ? b.done_today.map(t=>taskRow(t,'done')).join('') : '<div class="empty">Nothing done today</div>';
    document.getElementById('c-running').textContent = b.running.length;
    document.getElementById('c-stuck').textContent = b.stuck.length;
    document.getElementById('c-done').textContent = b.done_today.length;
    document.getElementById('agents').innerHTML = (d.agents||[]).map(a =>
      `<div class="agent" title="${esc(a.agent_id)} · last heartbeat ${esc(a.last_heartbeat || 'never')}"><span class="dot ${a.last_heartbeat ? 'green' : 'red'}"></span>${esc(a.name || a.agent_id)}</div>`).join('');
    refreshCosts();
  } catch(e) { console.error(e); }
}

async function refreshCosts() {
  try {
    const r = await fetch('/api/costs/full', {headers: {Authorization: 'Bearer ' + TOKEN}});
    if (!r.ok) return;
    const d = await r.json();
    const rows = (d.per_agent||[]).map(costRow).join('');
    document.getElementById('costs-body').innerHTML = rows ||
      '<div style="color:var(--text2);font-size:12px;padding:14px 0">No agents yet — join one with the SDK.</div>';
    // summary + grand totals
    const u = d.usage || {};
    document.getElementById('costs-summary').innerHTML =
      `${fmtk(u.calls||0)} calls · ${fmtk(u.tokens_in||0)} in / ${fmtk(u.tokens_out||0)} out tokens`;
    const t = d.total || {};
    document.getElementById('costs-body').insertAdjacentHTML('beforeend',
      `<div class="cost-grid">
        <div class="c total">Grand total</div><div class="c total"></div><div class="c total hide-m"></div>
        <div class="c total num">${fmt(t.hours)}h</div><div class="c total num"></div>
        <div class="c total num">$${fmt(t.cost)}</div><div class="c total num hide-m"></div>
        <div class="c total num hide-m">$${fmt(t.token_cost)}</div><div class="c total num grand">$${fmt(t.grand_total)}</div>
      </div>`);
    document.getElementById('costs').style.display = 'block';
  } catch(e) { /* commander token may not cover costs; skip */ }
}
refresh();
setInterval(refresh, 5000);
document.getElementById('ts').textContent = new Date().toLocaleTimeString();
</script>
</body>
</html>
