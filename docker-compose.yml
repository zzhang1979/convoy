services:
  convoy:
    build: .
    container_name: convoy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CONVOY_DB=/data/convoy.db
      - CONVOY_COMMANDER_TOKEN=${CONVOY_COMMANDER_TOKEN:-convoy-cmd-2026}
    volumes:
      - convoy-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  convoy-data:
